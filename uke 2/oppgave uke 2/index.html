<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oppgave 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- alt i style, kan flyttes til style.css mappa-->
<style>
    


</style>
<body>

<button onclick="togglemode(this)"> Bytt til darkmode</button>

<h1>mattematikk</h1>
<h3>login for spørsmål</h3>

<div class="loginCard">
    <input type="text" id="inputUsername" placeholder="username"/>
    <input type="password" id="inputPassword" placeholder="password"/>
    <button onclick="showMessage()"> log in</button>
    <div id="loginMessage" class="errorText"></div>
</div>

<!--< og > skrives som (<&lt og >&gt) så det ikke blir lest som ny html tag-->
<div id="matteSpørsmål">
    <h2 id="poengVisning">Points: 0</h2>
    <p>fyll inn &gt;, &lt; eller ==</p>

   <!-- spørsmål -->
    <p>
        <span id="tall1">0</span> 
        <input type="text" id="svar1" class="svarFelt" maxlength="2"> 
        <span id="tall2">0</span>
    </p>
    <p>
        <span id="tall3">0</span> 
        <input type="text" id="svar2" class="svarFelt" maxlength="2"> 
        <span id="tall4">0</span>
    </p>
    <p>
        <span id="tall5">0</span> 
        <input type="text" id="svar3" class="svarFelt" maxlength="2"> 
        <span id="tall6">0</span>
    </p>
   
    <button onclick="sjekkSvar()">sjekk svar</button>
    <button onclick="resetSpill()">reset</button>

    <div id="resultatText"></div>
</div>

<script>
    // Gjør så du kan skru av og på darkmode
    function togglemode(knapp) {
        document.body.classList.toggle("darkMode");
        
        if (document.body.classList.contains("darkMode")) {
            knapp.textContent = "Bytt til Lightmode";
        } else {
            knapp.textContent = "Bytt til Darkmode";
        }
    }

    // Variabler for poeng og tallene våre
    let points = 0;
    
    let number1 = 0, number2 = 0;
    let number3 = 0, number4 = 0;
    let number5 = 0, number6 = 0;

    
    // Reset-funksjonen lager nye tilfeldige tall for alle 3 feltene
   // --- NYE HJELPEFUNKSJONER (DRY-prinsippet) ---
    function generateNumber(elementId) {
        let randNum = Math.floor(Math.random() * 10) + 1;
        document.getElementById(elementId).textContent = randNum;
        return randNum;
    }

    function clearInput(elementId) {
        document.getElementById(elementId).value = "";
    }
    // ---------------------------------------------
    
    // Reset-funksjonen bruker nå hjelpefunksjonene i stedet for gjentakende kode
    function resetSpill() {
        number1 = generateNumber("tall1");
        number2 = generateNumber("tall2");
        number3 = generateNumber("tall3");
        number4 = generateNumber("tall4");
        number5 = generateNumber("tall5");
        number6 = generateNumber("tall6");
    
        // Tømmer input-boksene ved hjelp av hjelpefunksjonen
        clearInput("svar1");
        clearInput("svar2");
        clearInput("svar3");

        document.getElementById("resultatText").textContent = "";
    }

    // Sjekker brukernavn og passord
    function showMessage() {
        const username = document.getElementById("inputUsername").value;
        const password = document.getElementById("inputPassword").value;
        
        const mathContainer = document.getElementById("matteSpørsmål");
        const messageBox = document.getElementById("loginMessage");

        if (username === "admin" && password === "admin") {
            mathContainer.style.display = "block";
            messageBox.textContent = ""; 
           
            // resetter slik at tallene dukker opp med en gang man logger inn
            resetSpill();
        } else {
            mathContainer.style.display = "none";
            messageBox.textContent = "Feil brukernavn eller passord!";
        }
    }

    // --- HJELPEFUNKSJON FOR Å SJEKKE ÉT SVAR ---
    function evaluateSingleAnswer(n1, n2, userAnswer) {
        let correctSign = "";
        if (n1 > n2) {
            correctSign = ">";
        } else if (n1 < n2) {
            correctSign = "<";
        } else {
            correctSign = "==";
        }

        if (userAnswer === correctSign) {
            points += 1;
            return 1;
        } else {
            points -= 1;
            return 0;
        }
    }

    // Sjekker svarene når brukeren trykker "sjekk svar"
    function sjekkSvar() {
        const s1 = document.getElementById("svar1").value.trim();            
        const s2 = document.getElementById("svar2").value.trim();
        const s3 = document.getElementById("svar3").value.trim();

        let antallRiktige = 0;

        // Kjører hjelpefunksjonen for alle tre feltene
        antallRiktige += evaluateSingleAnswer(number1, number2, s1);
        antallRiktige += evaluateSingleAnswer(number3, number4, s2);
        antallRiktige += evaluateSingleAnswer(number5, number6, s3);

        // Viser resultatet på skjermen
        const resultatBoks = document.getElementById("resultatText");
        resultatBoks.textContent = "Du fikk " + antallRiktige + " av 3 riktige!";
        document.getElementById("poengVisning").textContent = "Points: " + points;
    }
</script>

</body>
</html>
